name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peers-deps

      - name: Build Pulse75 Frontend
        run: npm run build

      - name: Sync Native Android Platform
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Native Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Installable Pulse75 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse75-Android-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
